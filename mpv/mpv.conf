# ==========================================
# Configuración óptima de mpv para Anime & Streaming
# ==========================================

# Aceleración por hardware con NVIDIA RTX (Vulkan + libplacebo)
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# Calidad de escalado de alta fidelidad
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes

# Idiomas preferidos: Español Latino prioritario, Español España, luego Japonés e Inglés
alang=es-419,es-la,es,spa,ja,jpn,en
slang=es-419,es-la,es,spa,en
audio-pitch-correction=yes
audio-fallback=yes

# Subtítulos
sub-auto=fuzzy
sub-font='sans-serif'
sub-font-size=48
sub-border-size=2.5

# Búfer y caché para streaming fluido de torrents
cache=yes
demuxer-max-bytes=250M
demuxer-max-back-bytes=100M

# Compatibilidad con streams de audio web
user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0"
referrer="https://flaswish.com/"
